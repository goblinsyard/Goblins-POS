server {
  listen 80;
  client_max_body_size 10m;
  absolute_redirect off;

  # API + websockets proxied to the api service
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # overwrite (don't append) so a client can't spoof its address to dodge rate limits
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /ws/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Never cache the HTML shells, so every terminal picks up a new build on its
  # next load (the hashed JS/CSS under assets/ can still be cached).
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
  }
  location = /admin/index.html {
    alias /usr/share/nginx/html/admin/index.html;
    add_header Cache-Control "no-cache" always;
  }
  location = /kds/index.html {
    alias /usr/share/nginx/html/kds/index.html;
    add_header Cache-Control "no-cache" always;
  }

  # iPad "Add to Home Screen" manifest
  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # public online-booking page — can be linked or embedded (iframe) on goblinsyard.com
  location /book/ {
    alias /usr/share/nginx/html/book/;
    try_files $uri $uri/ /book/index.html;
    add_header Cache-Control "no-cache" always;
  }
  location = /book {
    return 301 /book/;
  }

  # back office SPA
  location /admin/ {
    alias /usr/share/nginx/html/admin/;
    try_files $uri $uri/ /admin/index.html;
  }

  # KDS SPA
  location /kds/ {
    alias /usr/share/nginx/html/kds/;
    try_files $uri $uri/ /kds/index.html;
  }

  # POS SPA (root)
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
